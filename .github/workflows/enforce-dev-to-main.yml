name: Enforce dev -> main

on:
  pull_request:
    branches:
      - main

jobs:
  check-source-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Check source branch
        if: >
          github.event.pull_request.head.ref != 'dev' ||
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Only the repository's dev branch can be merged into main."
          echo "Source: ${{ github.event.pull_request.head.repo.full_name }}:${{ github.event.pull_request.head.ref }}"
          exit 1

      - name: Source branch is valid
        run: echo "Valid dev -> main pull request."
